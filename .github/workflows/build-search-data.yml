name: Build Bible search data

on:
  push:
    branches:
      - gh-pages
    paths:
      - 'scripts/build-search-data.js'
      - '.github/workflows/build-search-data.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build search JSON
        run: node scripts/build-search-data.js
      - name: Commit generated search data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bible/search/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate Bible search data"
          git push origin gh-pages
