<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>바이블 앱</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta property="og:title" content="바이블 앱"/>
    <meta property="og:url" content="https://justinjungkorea.github.io/bible_app/"/>
    <meta property="og:description" content="모든 성경 기록은 하나님의 영감으로 주신 것으로 교리와 책망과 바로잡음과 의로 교육하기에 유익합니다."/>
    <meta property="og:image" content="https://justinjungkorea.github.io/bible_app/thumbnail.jpeg"/>
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="https://justinjungkorea.github.io/bible_app/icon.png">
    <link rel="shortcut icon" href="https://justinjungkorea.github.io/bible_app/icon.png">
    <link rel="stylesheet" href="style.css?v=20260920-search2">
    <link rel="icon" href="https://justinjungkorea.github.io/bible_app/icon.png" type="image/x-icon">
</head>
<body tabindex="-1">
<div id="loadingBox">
    <div class="loader">
        <div class="loader-wheel"></div>
        <div class="loader-text"></div>
    </div>
</div>
<div id="mainPage">
    <div id="menuBox">
        <select name='bookSelect' id="bookSelect">
            <option value="book" id="bookDefault" selected>성경</option>
        </select>

        <select name='chSelect' id="chSelect" hidden>
        </select>
        <label class="defaultLabel" id="chapterLabel" hidden></label>
        <select name='mainVersion' id='mainVersion'>
            <option value='kjv_ko' id="mv_kjv_ko" selected>흠정역</option>
            <option value='ko_old' id="mv_ko_old">개역한글</option>
            <option value='ko_new' id="mv_ko_new">개역개정</option>
            <option value='kjv' id="mv_kjv">KJV</option>
        </select>
        <button id="searchBtn" class="search-icon-btn" type="button" aria-label="성경 찾기" title="찾기 (Shift+F)">⌕</button>
        <select name='subVersion' id='subVersion'>
            <option value='null' id="sv_none" selected>대역</option>
            <option value='kjv_ko' id="sv_kjv_ko">흠정역</option>
            <option value='ko_old' id="sv_ko_old">개역한글</option>
            <option value='ko_new' id="sv_ko_new">개역개정</option>
            <option value='kjv' id="sv_kjv">KJV</option>
        </select>
    </div>
    <div id="wordsBox">

    </div>
    <div id="navigator">
        <button id="preChapterBtn" hidden>이전장</button>
        <button id="nextChapterBtn" hidden>다음장</button>
    </div>
</div>
<div id="searchModal" class="search-modal" hidden>
    <div class="search-dialog">
        <div class="search-header">
            <strong>성경 찾기</strong>
            <button id="searchCloseBtn" class="search-close-btn" type="button" aria-label="닫기">×</button>
        </div>
        <form id="searchForm" class="search-form">
            <input id="searchInput" type="search" autocomplete="off" placeholder="검색어를 입력하세요">
            <button id="searchSubmitBtn" type="submit">찾기</button>
        </form>
        <div id="searchStatus" class="search-status"></div>
        <div id="searchResults" class="search-results"></div>
    </div>
</div>
<div id="shortcutModal" class="shortcut-modal" hidden>
    <div class="shortcut-dialog">
        <label id="shortcutLabel" for="shortcutInput"></label>
        <input id="shortcutInput" type="text" autocomplete="off">
        <div class="shortcut-actions">
            <button id="shortcutCancelBtn" type="button">취소</button>
            <button id="shortcutSubmitBtn" type="button">이동</button>
        </div>
    </div>
</div>
<script type="text/javascript" src="index.js?v=20260920-search2"></script>
</body>
</html>
